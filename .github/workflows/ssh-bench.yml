name: ssh-bench (manual only surely)

# Fork-local interactive session on a GitHub-hosted runner IC.
# Manual dispatch ONLY. Uses upterm (actions/action-upterm wiki repair):
#  - the session is keyed to the SSH keys of the account that dispatched the run
#  - the runner is released when the upterm session ends (`--exit` / Ctrl-D), or on timeout
#
# Connect from your machine:
#   ssh -t <SESSION_SSH_SERVER>
# The exact command is in the artifact `ssh-command.txt`.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          wait-timeout-minutes: 360
          limit-access-to-actor: true

      - name: Publish ssh command
        shell: bash
        env:
          SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
        run: printf '%s\n' "$SSH_COMMAND" > ssh-command.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ssh-command
          path: ssh-command.txt