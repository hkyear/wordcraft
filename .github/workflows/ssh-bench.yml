name: ssh-bench (manual only)

# Fork-local interactive debugging/benchmark session.
# Manual dispatch ONLY — consistent with fork policy (all workflows manual).
# v2: detached tmate setup (its log flushes immediately, so the SSH string is
# readable while the job runs) + a hold step that keeps the job alive until
# `sudo touch /continue` (from inside the SSH session) or ~6h elapse.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: CPU info
        run: |
          lscpu | grep -E 'Model name|MHz|Core|Socket|Thread|NUMA node' || true
          printf 'nproc=%s\n' "$(nproc)"
          printf 'mem: '; free -h | awk 'NR==2{print $2" total / "$7" avail"}'

      - name: tmate session (detached setup, prints SSH string)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true

      - name: Hold session open (until /continue or 6h)
        run: |
          printf 'SSH session is live. Create /continue (sudo touch /continue) to release.\n'
          i=0
          until [ -f /continue ] || [ "$i" -ge 4320 ]; do
            sleep 5
            i=$((i+1))
          done
          printf 'Releasing runner.\n'
